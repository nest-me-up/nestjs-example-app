name: local_dev
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: my_database
    ports:
      - '9432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  my_service:
    build:
      context: .
      secrets:
        - npmrc
    ports:
      - '3000:3000'
      - '9229:9229'
    environment:
      NODE_ENV: local
      service_config: src/config/local_dev.yml
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev:debug
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

secrets:
  npmrc:
    file: ${HOME}/.npmrc
